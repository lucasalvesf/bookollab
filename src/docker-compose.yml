# Local development services. Run from src/: docker compose up -d
name: bookollab

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bookollab
      POSTGRES_USER: bookollab
      POSTGRES_PASSWORD: bookollab
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookollab -d bookollab"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Fake SMTP server: emails sent by the API show up at http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  # Database viewer: http://localhost:5050 (desktop mode, no login).
  # The "Bookollab (local)" server is pre-registered; its password is "bookollab".
  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@bookollab.dev
      PGADMIN_DEFAULT_PASSWORD: bookollab
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"
    volumes:
      - ./tools/pgadmin/servers.json:/pgadmin4/servers.json:ro
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      - postgres

volumes:
  postgres-data:
  pgadmin-data:
