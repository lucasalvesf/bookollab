name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore
      - run: dotnet build --no-restore -warnaserror
      # Testcontainers starts a real Postgres using the runner's Docker
      - run: dotnet test --no-build --verbosity normal

  app:
    name: App (Expo)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/apps/app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: src/apps/app/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
